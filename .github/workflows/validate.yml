name: Validate club pilot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Club.slnx --locked-mode
      - run: dotnet build Club.slnx -c Release --no-restore
      - run: dotnet test tests/Club.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none
        timeout-minutes: 5
      - name: Parse setup scripts in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts/pilot/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Publish Windows pilot
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($project in @('Server','Admin','Visitor','Agent')) {
            dotnet publish "src/Club.$project" -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o "artifacts/pilot/$project"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $project" }
          }
          Copy-Item scripts/pilot artifacts/pilot/Setup -Recurse
          Copy-Item docs/windows-pilot.md artifacts/pilot/READ-ME.md
          Copy-Item docs/validation.md artifacts/pilot/validation.md
      - name: Verify visitor startup task and game catalog on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-startup.ps1
      - name: Start both native Windows windows (no service installation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($app in @('Admin','Visitor')) {
            $process = Start-Process "artifacts/pilot/$app/Club.$app.exe" -ArgumentList '--smoke-test' -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "$app window did not finish smoke test" }
            if ($process.ExitCode -ne 0) { throw "$app failed: $($process.ExitCode)" }
          }
      - name: Install agent and verify real Windows service and visitor pipe
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: powershell
        run: ./tests/windows-agent.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: native-window-themes
          path: artifacts/ui/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            tests/Club.Tests/TestResults/*.trx
            tests/Club.Tests/TestResults/**/*Sequence*.xml
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: club-pilot-0.2-win-x64
          path: artifacts/pilot/
          retention-days: 14
